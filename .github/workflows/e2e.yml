name: E2E

# Real-browser tests: the built extension loaded unpacked into Playwright's Chromium.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TS_PERF_SLACK: 3 # shared CI runners are slower than a dev machine

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Browsers and system deps come preinstalled; keep the tag in step with @playwright/test.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx vite build
      - run: xvfb-run --auto-servernum npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
